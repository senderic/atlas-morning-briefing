# San Diego / California Local News Briefing Configuration
# Separate pipeline from the main Atlas Morning Briefing.
# Run with: python3 scripts/briefing_runner.py --config config_local.yaml

# --- Pipeline identity ---
# Own status file: run_briefing.sh runs this pipeline ~15 min after the main
# one, and a shared status.json means the second run erases the first's counters.
status_file_path: "status-local.json"
pipeline_name: "local"

state_file_path: ".local-state.json"
# Own status file: run_briefing.sh runs this pipeline ~15 min after the main
# one, and a shared status.json means the second run erases the first's counters.
status_file_path: "status-local.json"
pipeline_name: "local"
briefing_title: "San Diego Local News Briefing"
file_naming: "Local-Briefing-{yyyy}.{mm}.{dd}"

# --- Skip arxiv papers and stocks ---
arxiv_topics: []
stocks: []

# --- RSS feeds: local news sources ---
# All verified live. RSS costs nothing, so anything a local outlet publishes
# should come from here rather than from a paid Brave query.
blog_feeds:
  - name: "Voice of San Diego"
    url: "https://voiceofsandiego.org/feed/"
  - name: "KPBS Local"
    url: "https://www.kpbs.org/news/local.rss"
  - name: "Times of San Diego"
    url: "https://timesofsandiego.com/feed/"
  - name: "CalMatters"
    url: "https://calmatters.org/feed/"
  # Times of San Diego now publishes the former Beach & Bay Press / Peninsula
  # Beacon (covers Pacific Beach, Mission Beach, Crown Point). These two
  # category feeds surface beach-community news and event previews.
  - name: "Times of San Diego Events"
    url: "https://timesofsandiego.com/category/san-diego-events/feed/"
  - name: "Times of San Diego Community"
    url: "https://timesofsandiego.com/category/community/feed/"
  # Broadcast + investigative locals: these carry the closures, outages, and
  # neighborhood items that news search reliably misses.
  - name: "NBC 7 San Diego"
    url: "https://www.nbcsandiego.com/news/local/feed/"
  - name: "FOX 5 San Diego"
    url: "https://fox5sandiego.com/feed/"
  - name: "ABC 10News San Diego"
    url: "https://www.10news.com/news.rss"
  - name: "inewsource"
    url: "https://inewsource.org/feed/"
  - name: "OB Rag"
    url: "https://obrag.org/feed/"
  # County press office: beach closures/advisories, public comment periods,
  # wildfire readiness, benefit program changes.
  - name: "San Diego County News Center"
    url: "https://www.countynewscenter.com/feed/"

# --- Interest profile for relevance filtering / ranking ---
# Ordered life-first: what changes this week for someone living in Pacific
# Beach outranks policy, and policy outranks investment angles. These weights
# also seed the <interests> block in news/blog ranking prompts (no arxiv
# topics exist in this pipeline).
interest_profile:
  # Tier 1 -- daily life around the beach communities
  - topic: "Pacific Beach, Mission Beach, and Crown Point community news"
    weight: 1.0
  - topic: "Local events, festivals, markets, and community meetings worth attending"
    weight: 0.98
  - topic: "Road closures, construction, parking changes, and traffic near the beach communities"
    weight: 0.96
  - topic: "Beach and bay conditions: water quality advisories, surf and rip current hazards, closures"
    weight: 0.94
  - topic: "Weather, fire, flood, and power/water outage impacts in San Diego"
    weight: 0.92
  - topic: "Public safety incidents and trends in the Pacific Beach area"
    weight: 0.9
  - topic: "New restaurants, shops, parks, and rec/library programming nearby"
    weight: 0.88
  - topic: "Mission Bay and Crown Point park projects and access"
    weight: 0.86
  - topic: "San Diego transit service changes affecting daily travel"
    weight: 0.84
  # Tier 2 -- dated obligations and decisions a resident can act on
  - topic: "Public comment periods, city council votes, and community planning group decisions"
    weight: 0.8
  - topic: "Utility rate changes, city fees, permit windows, and tax deadlines"
    weight: 0.78
  # Tier 3 -- policy that changes what a resident can do or pay
  - topic: "San Diego zoning and land-use changes"
    weight: 0.62
  - topic: "California housing legislation and policy"
    weight: 0.6
  - topic: "Coastal regulation, sea-level rise, and beach erosion policy"
    weight: 0.58
  - topic: "California tax and regulatory changes for residents and small business"
    weight: 0.56
  # Tier 4 -- investment and business, deliberately last
  - topic: "Local real estate market moves and investment opportunities"
    weight: 0.4
  - topic: "San Diego business, development deals, and commercial real estate"
    weight: 0.38

# --- Domain framing for LLM prompts ---
# actionable: ask every summary to lead with the date/place/cost/decision.
# priorities: ordered ranking tiers consumed by scripts/intelligence.py
#   (news ranking, blog ranking, executive summary). Tier 1 fills most slots.
briefing_profile:
  domain: "San Diego neighborhood life, local civic decisions, and California policy"
  audience: >-
    a Pacific Beach resident planning their week -- what affects their
    streets, their beach, their bills, and their neighborhood -- who also
    keeps an eye on local real-estate and business opportunities
  landscape: "the San Diego neighborhood, civic, and real-estate landscape"
  actionable: true
  priorities:
    - >-
      Daily life in and around Pacific Beach, Mission Beach, and Crown Point:
      events worth attending, road/beach closures and construction, water
      quality and surf hazards, weather/fire/outage impacts, public-safety
      incidents nearby, transit and parking changes, new restaurants, shops,
      parks, and rec/library programming. Fill most of the slots from this
      tier.
    - >-
      Anything with a date or a decision attached the reader can act on:
      public comment periods, council and community-planning votes, permit
      windows, utility rate changes, fee and tax deadlines, service
      disruptions with start dates.
    - >-
      Citywide and California policy that changes what a resident can do or
      pay -- housing and zoning rules, coastal regulation, transit projects,
      taxes and fees. Include it when it is concrete; skip process-only
      chatter with no effect yet.
    - >-
      Investment, real-estate, and business angles: market moves, development
      deals, opportunities. Secondary -- keep at most one or two slots for the
      most consequential money item, and never open the briefing with it.

# --- News search queries (Brave Search API) as an interest taxonomy DAG ---
# Root queries fire every run as a baseline; leaf queries are selected per-run
# (up to max_dynamic_queries) from signal in yesterday's briefing and today's
# blogs. See scripts/interest_graph.py.
#
# Query shape matters more than query count. Measured against the live Brave
# news API (2026-08-22):
#   - Long keyword strings drift out of the area: "San Diego road closure
#     construction traffic detour this week" returned 15 results, all of them
#     Bay Area / Texas / Pennsylvania. Brave treats "San Diego" as a ranking
#     hint, not a filter.
#   - Quoting does not fix it: '"San Diego" road closure detour' returned 0.
#     site: is unsupported on the news endpoint (also 0).
#   - What works: 2-4 words built on one distinctive proper noun, e.g.
#     "Crown Point San Diego" (surfaced the Amazon-delivery-hub-in-the-park
#     story across 6 outlets) and "Mission Bay San Diego park".
#
# freshness is a property of the branch, not the run, and is inherited by
# children: the beach neighborhoods do not generate news every 24 hours, so a
# "pd" window starves those queries and Brave backfills with national noise.
# Condition queries (surf, outages, closures) are deliberately absent -- they
# are served by the alerts scanner below, which is precise and free.
interest_graph:
  max_dynamic_queries: 3
  roots:
    - id: "neighborhood"
      query: "Pacific Beach San Diego"
      freshness: "pw"
      children:
        - id: "mission_beach"
          query: "Mission Beach San Diego"
          priority: 1.4
        - id: "crown_point"
          query: "Crown Point San Diego"
          priority: 1.35
        - id: "mission_bay"
          query: "Mission Bay San Diego park"
          priority: 1.3
        - id: "openings"
          query: "San Diego restaurant opening"
          priority: 1.0
    - id: "beach_access"
      query: "San Diego beach parking"
      freshness: "pw"
      children:
        - id: "lifeguards"
          query: "San Diego lifeguards"
          priority: 1.2
        - id: "coastal_commission"
          query: "San Diego coastal commission"
          priority: 1.0
    - id: "city_hall"
      query: "San Diego city council"
      freshness: "pw"
      children:
        - id: "planning_groups"
          query: "San Diego community planning group"
          priority: 1.1
        - id: "parks"
          query: "San Diego parks and recreation"
          priority: 1.1
    - id: "ca_policy"
      query: "California housing law"
      freshness: "pw"
      children:
        - id: "sd_housing_law"
          query: "San Diego housing development lawsuit"
          priority: 0.8
        - id: "ca_new_laws"
          query: "California new laws"
          priority: 0.7
    - id: "market"
      query: "San Diego housing market"
      freshness: "pw"
      children:
        - id: "rents"
          query: "San Diego rent prices"
          priority: 0.6
        - id: "commercial"
          query: "San Diego commercial real estate"
          priority: 0.5

# Default freshness for any query with no branch binding (static news_queries).
news_freshness: "pd"

# --- Geographic relevance gate ---
# Applied to Brave results before the LLM ranking layer, so out-of-area stories
# never consume prompt tokens or a top-5 slot. Items from trusted_sources pass
# without a place-name match (a local outlet is local even when the headline
# does not say so). Disable by setting enabled: false.
geo_filter:
  enabled: true
  place_terms:
    - "san diego"
    - "pacific beach"
    - "mission beach"
    - "mission bay"
    - "crown point"
    - "kate sessions"
    - "la jolla"
    - "ocean beach"
    - "point loma"
    - "clairemont"
    - "bay park"
    - "coronado"
    - "chula vista"
    - "encinitas"
    - "oceanside"
    - "carlsbad"
    - "escondido"
    - "california"
  # Pay-to-publish press-release portals: anyone can post unvetted marketing
  # copy, and it mentions the neighborhood often enough to pass place_terms.
  # Blocked beats both place_terms and trusted_sources.
  blocked_sources:
    - "openpr.com"
    - "prnewswire.com"
    - "einpresswire.com"
    - "globenewswire.com"
    - "businesswire.com"
    - "accesswire.com"
    - "newswire.com"
  trusted_sources:
    - "voiceofsandiego.org"
    - "timesofsandiego.com"
    - "kpbs.org"
    - "obrag.org"
    - "inewsource.org"
    - "sandiegouniontribune.com"
    - "nbcsandiego.com"
    - "fox5sandiego.com"
    - "10news.com"
    - "sandiegomagazine.com"
    - "sdnews.com"
    - "coronadotimes.com"
    - "countynewscenter.com"
    - "sandiego.gov"

# --- Source diversity ---
# Cap on items from one outlet per section. The default 2 left the news section
# with only two items on a day the Union-Tribune had the three biggest local
# stories; a small local press corps justifies a looser cap.
source_diversity:
  max_per_source: 3

# --- Cross-outlet duplicate collapse ---
# One viral local story arrives from a dozen syndicating outlets with different
# headlines. Threshold is Jaccard overlap of headline content words, calibrated
# on live results: retellings of one story scored 0.23-0.47, distinct local
# stories 0.00-0.17.
news_similarity_dedup:
  enabled: true
  threshold: 0.3

# --- Active public-safety alerts (National Weather Service) ---
# Free, no API key, and scoped to exact zones -- the one reliable source for
# "is there a heat warning where I live today". News search answers that
# question with whatever storm is trending nationally.
# Find your zones: curl 'https://api.weather.gov/points/<lat>,<lon>' and read
# forecastZone / fireWeatherZone / county.
#   CAZ043 = San Diego County Coastal Areas (forecast)
#   CAZ243 = San Diego County Coastal Areas (fire weather)
# The county zone CAC073 is deliberately omitted: it fires for inland desert
# heat warnings that do not apply at the coast.
alerts:
  enabled: true
  provider: "nws"
  zones:
    - "CAZ043"
    - "CAZ243"
  max_alerts: 4
  timeout: 20
  user_agent: "atlas-morning-briefing (${ALERT_CONTACT:-briefing@example.com})"

# --- Section layout (no papers, no stocks, no defense features) ---
# alerts render first (they are the only time-critical items), then
# happenings, then news, then local analysis.
section_order: ["alerts", "happenings", "news", "blogs"]

# --- Upcoming happenings (Pacific Beach / Mission Beach / Crown Point / Kate Sessions) ---
# Dedicated Brave search for neighborhood events. Uses a wider freshness window
# than the main news ("pw" = past week) so event announcements published several
# days ahead are caught.
#
# happenings_fetch_weekday: fetch fresh happenings only on these weekdays
# (0=Mon ... 6=Sun; a single value or a list); on other days the previous fetch
# is reused from state, so Brave is hit for events twice a week rather than
# every morning.
#
# Thursday previews the coming weekend, Monday refreshes for midweek and the
# next weekend's announcements. A Saturday-only fetch used to leave the section
# advertising a weekend that had already ended by Tuesday. The date-aware
# ranking prompt drops anything past on top of this.
happenings_fetch_weekday: [0, 3]
happenings_queries:
  - "things to do this weekend San Diego"
  - "Pacific Beach San Diego events"
  - "Mission Beach San Diego events"
  - "Mission Bay San Diego park"
  - "San Diego festivals concerts"
max_happenings: 8
happenings_freshness: "pw"

# --- Custom section headings ---
section_headings:
  executive_summary: "Executive Summary"
  alerts: "Active Alerts"
  happenings: "Pacific Beach Area — Upcoming Happenings"
  news: "Around You — What Changes This Week"
  blogs: "Local Sources & Analysis"
  errors: "Errors"

# --- Disable defense-specific features ---
features:
  solo_founder_angle: false
  agent_cost_optimization: false
  weekly_deep_dive: false

# --- EPUB metadata ---
epub:
  title_format: "Local Briefing - {date}"
  author: "Atlas Local"

# --- Output ---
output_dir: "briefings/local"

# --- Snapshot settings ---
snapshot:
  enabled: true
  dir: "snapshots/local"

# --- Paper scoring (unused but required by code path) ---
paper_scoring:
  has_code: 5
  topic_match: 3
  recency: 2
  citation_count: 1
num_paper_picks: 2
repro_min_score: 12

# --- Maximum items ---
max_papers: 30
max_blogs: 8
max_news: 15
arxiv_days_back: 3

# Blog freshness window, separate from arxiv_days_back. Blogs and papers have
# different cadences: at 3 days a weekly blogger is invisible on most runs,
# which the quality checker reported as a yield collapse against feeds that
# were healthy. Measured 2026-08-29 across 28 feeds: 17 had posted within 3
# days, 19 within 7, 21 within 14. Cross-day dedup stops a wider window from
# re-showing an item the reader already saw.
blog_days_back: 7

# ArXiv fetch behaviour (legacy export.arxiv.org path).
#
# Topics are scanned SEQUENTIALLY, matching upstream. This used to run 8
# topics concurrently, which exceeds what export.arxiv.org tolerates: a run on
# 2026-08-27 lost 20/20 topic searches to 429s and read timeouts and shipped a
# briefing with no papers at all. ArXiv's terms ask for ~1 request per 3s.
arxiv_request_delay: 3.0
#
# Wrap multi-word topics in quotes for an exact phrase match. Upstream does
# this by default; measured against the live API on 2026-08-28 it returned 0
# papers for 7 of the 9 multi-word topics above (at 3 and at 14 days back),
# because these topics are conceptual descriptions rather than literal
# phrases. Recall is preferable here since TF-IDF scoring and the interest
# profile already cull irrelevant hits. Turn on only if your topics are
# literal phrases that appear verbatim in paper text.
arxiv_exact_phrase: false

# --- Concurrency ---
max_workers: 6

# --- PDF disabled ---
pdf:
  enabled: false

# --- Delivery settings ---
kindle_email: "${KINDLE_EMAIL:-YOUR_NAME@kindle.com}"
sender_email: "${SENDER_EMAIL:-your-sender@gmail.com}"
output_format: "kindle"
email_recipients:
  - "${RECIPIENT_EMAIL:-your-email@example.com}"

# --- Logging ---
log_level: "DEBUG"

# --- LLM CLI configuration (same as main pipeline) ---
gemini:
  enabled: false
  ignore_hard_quota: true
  track_hard_quotas: true
  internal_max_attempts: 1
  max_calls_per_run: 50
  retry_wait_seconds: 61
  key_swap_delay: 5
  call_log_path: "logs/local-gemini-calls.jsonl"
  models:
    heavy: "pro"
    medium: "flash"
    light: "flash-lite"

opencode:
  # LAST-RESORT PAID BACKSTOP. Reached only after every free OpenRouter model
  # for the tier has failed (see llm.backend_priority below), so in a normal
  # run this costs nothing.
  #
  # The models here are the PAID `opencode-go` ones, not the `opencode/*-free`
  # ones. The free opencode models answer a trivial preflight ping but stall on
  # real briefing prompts, which is what made them useless as a safety net.
  # Verified 2026-08-27: deepseek-v4-pro 14s, deepseek-v4-flash 8s,
  # glm-5.3-flash 21s on a real ranking prompt.
  enabled: true
  models:
    heavy: "opencode-go/deepseek-v4-pro"
    medium: "opencode-go/minimax-m3"
    light: "opencode-go/qwen3.6-plus"
  # One fallback per tier, degrading down a weight class, never up.
  fallback_models:
    heavy: ["opencode-go/glm-5.3-flash"]
    medium: ["opencode-go/mimo-v2.5"]
    light: ["opencode-go/mimo-v2.5"]
  # Small budget on purpose: this tier is an emergency backstop, and capping it
  # bounds what a bad day can cost.
  max_calls_per_run: 20
  # Do not probe this backend at 5:45 AM: it is paid, and the probe would be
  # the only call that ever bills it on a healthy day.
  preflight_check: false
  # TIMEOUT BUDGET — must fit inside composite.timeout_seconds below.
  # The composite gives each backend one window for its ENTIRE internal chain,
  # so worst case = timeout x (1 + max_retries) x models-in-chain. At the old
  # 300s/2-retries/3-models it needed 2730s against a 400s window and was
  # killed after a single attempt, meaning the backstop could never actually
  # serve a request. Now: 150 x 1 x 2 = 300s, inside the 350s window.
  # Retries are 0 deliberately — a last resort should fail fast to the next
  # model rather than burn the window retrying a stalled one.
  timeout: 150
  max_retries_per_model: 0
  # Estimated DeepSeek V4 Flash paid rates, used for the usage-summary footer.
  pricing:
    input_per_million: 0.14
    output_per_million: 0.28

# LLM backend order: tried front to back, so free backends come first and the
# paid opencode-go backstop is last. A backend that is disabled is skipped.
llm:
  backend_priority: ["openrouter", "gemini", "opencode"]

# OpenRouter configuration (OpenAI-compatible API) — the PRIMARY backend.
# Requires an API key: OPENROUTER_API_KEY or OPENAI_API_KEY (pointing at
# OpenRouter) in the environment.
openrouter:
  enabled: true
  api_base: "https://openrouter.ai/api/v1/chat/completions"
  # Tier ladder. Verified free + reachable on 2026-08-27 against this account.
  # Keep it monotonic: heavy > medium > light in both size and context window.
  # Fallbacks may only degrade DOWN a tier, never up, so a heavy prompt never
  # silently lands on a light model.
  models:
    heavy: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"      # 550B, 1M ctx
    medium: "openrouter/minimax/minimax-m3:free"                    # 1M ctx, no reasoning tax
    light: "openrouter/nvidia/nemotron-3-super-120b-a12b:free"      # 120B-A12B, 262k ctx
  fallback_models:
    heavy: ["openrouter/dots-studio/dots-3-note-preview:free", "openrouter/minimax/minimax-m3:free"]
    medium: ["openrouter/nvidia/nemotron-3-super-120b-a12b:free", "openrouter/dots-studio/dots-3-note-preview:free"]
    light: ["openrouter/cohere/north-mini-code:free", "openrouter/minimax/minimax-m3:free"]
  # NOT in the roster, and why (re-verify before re-adding):
  #   z-ai/glm-5.2:free                  persistently 429 "rate-limited upstream"
  #   google/gemma-4-*:free              404, blocked by this account's data policy
  #   nvidia/nemotron-3.5-lightning:free 400 "DEGRADED function cannot be invoked"
  #   thinkingmachines/inkling*:free     403, agentic harnesses only
  #   openrouter/auto                    NOT free — it is the paid auto-router
  #   openrouter/free                    free, but an auto-router: it picks its
  #                                      own model, which defeats tier pinning
  max_calls_per_run: 100
  # Simultaneous in-flight requests. The runner enriches sections in parallel
  # (max_workers), so this is the real throttle on the free tier: 6 concurrent
  # requests all succeeded, 12 produced silent empty bodies.
  max_concurrent_requests: 4
  # TIMEOUT BUDGET — must fit inside composite.timeout_seconds.
  # Worst case = timeout x (1 + max_retries_per_model) x models-in-chain
  #            = 75 x 2 x 3 = 450s, inside the 500s window.
  # Real responses land in 3-25s; the retry exists for the transient upstream
  # 502s these free endpoints return inside an HTTP 200 body.
  timeout: 75
  max_retries_per_model: 1
  max_tokens: 4096
  temperature: 0.3
  # All models above are `:free`, so the run should bill $0.00. The usage
  # summary reports the API's own cost field and flags any non-zero value.
  pricing:
    input_per_million: 0.0
    output_per_million: 0.0

# LLM fallback chain tuning
composite:
  timeout_seconds: 500

# Amazon Bedrock configuration
# Set enabled: false to run in deterministic mode (no LLM, zero cost)
bedrock:
  enabled: false

# --- Daily quality check (scripts/quality_check.py, cron 06:40) ---
# See references/quality_monitoring_design.md.
quality_check:
  # Minimum item counts before a section is called thin (INFO only).
  # Alerts reuse the briefing's own Gmail path (scripts/email_distributor.py).
  # CRITICAL findings send one email per run, subject to the 24h dedupe.
  # daily_digest: true also mails on a clean day; default keeps quiet mornings quiet.
  alert_email:
    recipients:
      - "${RECIPIENT_EMAIL:-your-email@example.com}"
    daily_digest: false
  section_floors:
    news: 3
    happenings: 2
    blogs: 3
  judge:
    # The full rubric: this briefing is judged on being life-first and local.
    dimensions:
      - "tier_1_share"
      - "lead_alignment"
      - "actionability"
      - "locality"
      - "specificity"
      - "freshness"
  source_health:
    # A feed that 404s or stops parsing: WARN once, CRITICAL if it persists.
    dead_url_runs: 3
    # A feed that still returns 200 but has not published in this long.
    stale_after_days: 90
    # Zero items for this many consecutive runs, only alerting when the feed's
    # own trailing median says it used to contribute.
    zero_run_threshold: 7
    median_window: 30
    # Queries whose trailing mean yield is below 1 are pure quota burn.
    query_window: 14
