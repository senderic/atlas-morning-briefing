# Model Capability Registry
# Defines reasoning control capabilities for each model.
# Used by OpencodeClient and OpenRouterClient to apply reasoning control
# without hardcoding model-specific logic.

model_capabilities:
  # ===== opencode models =====
  opencode/nemotron-3-ultra-free:
    supports_reasoning_control: true
    reasoning_control_method: "cli_flag"
    cli_flag_name: "variant"
    cli_flag_value: "minimal"
    known_cot_leakage: false
    non_reasoning_variant: null

  opencode/nemotron-3.5-lightning-free:
    supports_reasoning_control: false
    reasoning_control_method: "model_swap"
    known_cot_leakage: true
    non_reasoning_variant: "opencode/mimo-v2.5-free"

