name: Tests

on:
  push:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    # Standard astral-sh uv container with Python preinstalled. Single
    # version (3.12) because this is a personal tool, not a library —
    # the cron runs on one Python version and that's the only one that
    # needs to be green. Bump the tag when you upgrade the cron host.
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync dependencies (project + dev extras)
        run: uv sync --all-extras --dev

      - name: Run pytest
        run: uv run pytest -v --tb=short

      # Sanity check that no live-only diagnostics accidentally got picked
      # up by pytest. scripts/test_briefing_alignment.py needs gemini-cli +
      # API keys and would fail in CI, but it lives in scripts/ and the
      # pyproject's testpaths is "tests/" so it shouldn't be discovered.
      # This step makes the implicit contract explicit and visible.
      - name: Confirm live-only diagnostics are excluded
        run: |
          if uv run pytest --collect-only -q 2>&1 | grep -q "test_briefing_alignment"; then
            echo "ERROR: scripts/test_briefing_alignment.py was discovered "
            echo "by pytest. That test needs gemini-cli + API keys and "
            echo "must not run in CI. Restore testpaths='tests' in "
            echo "pyproject.toml."
            exit 1
          fi
