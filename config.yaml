# News search queries (Brave Search API) as an interest taxonomy DAG.
# Root queries fire every run as a baseline; leaf queries are selected per-run
# (up to max_dynamic_queries) based on signal from yesterday's briefing and
# today's blogs. See scripts/interest_graph.py.
interest_graph:
  max_dynamic_queries: 4
  roots:
    - id: "defense_contracts"
      query: "Defense AI contracts programs DoD DIU DARPA SBIR"
      children:
        - id: "dod_contracts"
          query: "Department of Defense AI contracts and prototypes"
        - id: "diu"
          query: "DIU Defense Innovation Unit AI projects"
        - id: "darpa"
          query: "DARPA AI research breakthroughs"
        - id: "sbir"
          query: "Defense tech startup AI innovation SBIR"
    - id: "defense_contractors"
      query: "Defense contractor AI systems electronic warfare"
      children:
        - id: "palantir"
          query: "Palantir AIP defense implementation"
          priority: 1.2
        - id: "anduril"
          query: "Anduril Lattice AI updates"
        - id: "lockheed"
          query: "Lockheed Martin AI development practices"
        - id: "northrop"
          query: "Northrop Grumman AI systems"
        - id: "shield_ai"
          query: "Shield AI autonomous flight updates"
        - id: "epirus"
          query: "Epirus AI electronic warfare"
    - id: "ai_models"
      query: "AI foundation model benchmarks market share"
      children:
        - id: "model_benchmarks"
          query: "AI model benchmarks Claude vs Gemini vs GPT-4"
        - id: "market_share"
          query: "AI foundation model market share shifts"
    - id: "edge_ai"
      query: "Edge AI off-grid local inference tactical hardware"
      children:
        - id: "nvidia_offgrid"
          query: "NVIDIA GPU based AI systems for off-grid operations"
          priority: 1.2
        - id: "local_llm"
          query: "Local LLM deployment on single-node workstations for specialized tasks"
        - id: "tactical_edge"
          query: "tactical edge AI hardware and offline model execution"
    - id: "commercial_space"
      query: "Commercial space lunar asteroid launch infrastructure"
      children:
        - id: "lunar_mining"
          query: "Lunar mining and resource extraction commercial projects"
        - id: "asteroid_mining"
          query: "Asteroid mining startup funding and technology"
        - id: "intuitive_machines"
          query: "Intuitive Machines lunar infrastructure updates"
        - id: "rocket_lab"
          query: "Rocket Lab orbital services and satellite manufacturing"
        - id: "artemis"
          query: "NASA Artemis program commercial partnerships"
    - id: "military_space"
      query: "Military space Starshield orbital data centers"
      children:
        - id: "starshield"
          query: "SpaceX Starshield and military space applications"
        - id: "orbital_dc"
          query: "Orbital data centers and space-based AI infrastructure"

# Paper scoring weights
paper_scoring:
  has_code: 7
  topic_match: 3
  recency: 2
  citation_count: 1

# Reproduction feasibility gate (applied by intelligence layer)
# Papers scoring below repro_min_score/25 are dropped from top picks
repro_min_score: 12

# Delivery settings
kindle_email: "${KINDLE_EMAIL:-YOUR_NAME@kindle.com}"
sender_email: "${SENDER_EMAIL:-your-sender@gmail.com}"
output_format: "kindle"

# Email distribution list (receives rich HTML briefing)
# Can be a list or a comma-separated string in environment variables
email_recipients:
  - "${RECIPIENT_EMAIL:-your-email@example.com}"

# Output directory for generated briefings
output_dir: briefings

# Snapshot settings (saves raw API data for sender-trades to source from)
snapshot:
  enabled: true
  dir: snapshots

# File naming pattern
file_naming: "Atlas-Briefing-{yyyy}.{mm}.{dd}"

# Paper recommendations
num_paper_picks: 3

# Date range for arxiv search (days)
arxiv_days_back: 3

# Maximum items per section
max_papers: 30
max_blogs: 12
max_news: 15

# Concurrency settings
max_workers: 6

# LLM fallback chain tuning
composite:
  # Max seconds to wait on any single backend before skipping it and moving to
  # the next fallback. Prevents a quota-exhausted/hanging backend (e.g. Gemini
  # heavy-tier retry loop) from stalling the run and blocking email delivery.
  timeout_seconds: 400

# PDF settings
pdf:
  enabled: false
  font_size: 10
  line_spacing: 1.5
  include_toc: true
  include_emoji: false

# LLM CLI configuration (supports both `agy` (Antigravity) and legacy `gemini`).
# When `cli_binary` is omitted the client auto-detects, preferring `agy` if
# present. Set explicitly to "agy" or "gemini" to pin a specific backend.
gemini:
  enabled: true
  # cli_binary: "agy"   # uncomment to force Antigravity even if both exist
  ignore_hard_quota: true
  track_hard_quotas: true
  internal_max_attempts: 1
  max_calls_per_run: 50
  retry_wait_seconds: 61
  key_swap_delay: 5
  # Per-call usage log: appends one JSON line per LLM call (tier, resolved
  # model, key index, full token breakdown, estimated cost, latency) here.
  # Relative paths resolve against the repo root. Comment out to disable.
  call_log_path: "logs/gemini-calls.jsonl"
  models:
    heavy: "pro"
    medium: "flash"
    light: "flash-lite"

# OpenCode configuration (alternative to Gemini CLI).
# When enabled, the pipeline uses `opencode run` with free-tier models
# (e.g. opencode/deepseek-v4-flash-free) instead of the Gemini CLI.
# Requires `opencode` binary on PATH. Use `--dry-run` to test.
opencode:
  enabled: true
  models:
    heavy: "opencode/nemotron-3-ultra-free"
    medium: "opencode/deepseek-v4-flash-free"
    light: "opencode/deepseek-v4-flash-free"
  # Fallback chain tried (in order) when the primary model for a tier fails
  # (non-zero exit, empty response, or timeout).
  fallback_models:
    heavy: ["opencode/mimo-v2.5-free", "opencode/nemotron-3.5-lightning-free"]
    medium: ["opencode/mimo-v2.5-free", "opencode/nemotron-3.5-lightning-free"]
    light: ["opencode/mimo-v2.5-free", "opencode/nemotron-3.5-lightning-free"]
  max_calls_per_run: 50
  # Per-call timeout. 120s is generous — fast failures (model not found,
  # insufficient balance, rate limit) are detected immediately via NDJSON
  # error events and skip straight to the fallback chain without waiting
  # for the timeout.
  timeout: 300
  # Estimated pricing if using paid DeepSeek V4 Flash API (e.g. Deep Infra)
  # instead of the free opencode model. Used in the usage summary footer.
  pricing:
    input_per_million: 0.14    # $0.14 per 1M input tokens
    output_per_million: 0.28   # $0.28 per 1M output tokens

# OpenRouter configuration (OpenAI-compatible API fallback).
# Requires an API key: OPENROUTER_API_KEY or OPENAI_API_KEY (pointing at
# OpenRouter) in the environment.
openrouter:
  enabled: true
  api_base: "https://openrouter.ai/api/v1/chat/completions"
  models:
    heavy: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
    medium: "openrouter/minimax/minimax-m3:free"
    light: "openrouter/google/gemma-4-31b-it:free"
  fallback_models:
    heavy: ["openrouter/z-ai/glm-5.2:free", "openrouter/openrouter/free"]
    medium: ["openrouter/z-ai/glm-5.2:free", "openrouter/openrouter/free"]
    light: ["openrouter/nvidia/nemotron-3.5-lightning:free", "openrouter/openrouter/free"]
  max_calls_per_run: 100
  timeout: 120
  max_tokens: 4096
  temperature: 0.3
  pricing:
    input_per_million: 0.25   # $0.25 per 1M input tokens
    output_per_million: 0.75  # $0.75 per 1M output tokens

# Amazon Bedrock configuration
# Set enabled: false to run in deterministic mode (no LLM, zero cost)
bedrock:
  enabled: false

# Logging
log_level: "DEBUG"

