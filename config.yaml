# --- Daily quality check (scripts/quality_check.py, cron 06:40) ---
# See references/quality_monitoring_design.md.
quality_check:
  # Alerts reuse the briefing's own Gmail path (scripts/email_distributor.py).
  # CRITICAL findings send one email per run, subject to the 24h dedupe.
  # daily_digest: true also mails on a clean day; default keeps quiet mornings quiet.
  alert_email:
    recipients:
      - "${RECIPIENT_EMAIL:-your-email@example.com}"
    daily_digest: false
  section_floors:
    news: 3
    blogs: 3
    top_papers: 1
  judge:
    # tier_1_share and locality are local-briefing goals; this pipeline is
    # deliberately national/global, so scoring it on them would report a
    # permanent, meaningless red every morning.
    dimensions:
      - "lead_alignment"
      - "actionability"
      - "specificity"
      - "freshness"
  source_health:
    dead_url_runs: 3
    stale_after_days: 90
    zero_run_threshold: 7
    median_window: 30
    query_window: 14
    # Low-frequency writers: alive and worth keeping, they just post rarely.
    # Without these overrides they would be flagged every week forever.
    feed_overrides:
      "Karpathy":
        stale_after_days: 400
      "Lilian Weng":
        stale_after_days: 400
      "Chip Huyen":
        stale_after_days: 700
      "Eugene Yan":
        stale_after_days: 400
      "Benedict Evans":
        stale_after_days: 200
      "BAIR":
        stale_after_days: 300
      "The Gradient":
        stale_after_days: 400
