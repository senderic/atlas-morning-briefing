# Interest profile for relevance filtering
interest_profile:
  - topic: "AI in Defense and Electronic Warfare"
    weight: 1.0
  - topic: "Defense Contractor AI integration and development practices"
    weight: 0.9
  - topic: "AI foundation model market share shifts (Claude vs Gemini vs GPT)"
    weight: 0.8
  - topic: "Battlefield Edge Computing"
    weight: 0.7
  - topic: "Autonomous Driving End-to-End"
    weight: 0.6

# Stock watchlist (Finnhub API)
stocks:
  - NVDA
  - MSFT
  - PLTR
  - GOOGL
  - AMZN
  - META
  - VRT
  - ANET
  - EQIX
  - LMT
  - RTX
  - NOC
  - GD
  - SPY

# News search queries (Brave Search API)
news_queries:
  - "Department of Defense AI contracts and prototypes"
  - "Defense tech startup AI innovation SBIR"
  - "DIU Defense Innovation Unit AI projects"
  - "AI model benchmarks Claude vs Gemini vs GPT-4"
  - "AI foundation model market share shifts"
  - "Palantir AIP defense implementation"
  - "Anduril Lattice AI updates"
  - "Lockheed Martin AI development practices"
  - "Northrop Grumman AI systems"
  - "DARPA AI research breakthroughs"
  - "Shield AI autonomous flight updates"
  - "Epirus AI electronic warfare"

# Paper scoring weights
paper_scoring:
  has_code: 7
  topic_match: 3
  recency: 2
  citation_count: 1

# Reproduction feasibility gate (applied by intelligence layer)
# Papers scoring below repro_min_score/25 are dropped from top picks
repro_min_score: 12

# Delivery settings
kindle_email: "${KINDLE_EMAIL:-YOUR_NAME@kindle.com}"
sender_email: "${SENDER_EMAIL:-your-sender@gmail.com}"
output_format: "kindle"

# Email distribution list (receives rich HTML briefing)
# Can be a list or a comma-separated string in environment variables
email_recipients:
  - "${RECIPIENT_EMAIL:-your-email@example.com}"

# File naming pattern
file_naming: "Atlas-Briefing-{yyyy}.{mm}.{dd}"

# Paper recommendations
num_paper_picks: 3

# Date range for arxiv search (days)
arxiv_days_back: 3

# Maximum items per section
max_papers: 30
max_blogs: 12
max_news: 15

# PDF settings
pdf:
  font_size: 10
  line_spacing: 1.5
  include_toc: true
  include_emoji: false

# Gemini CLI configuration
gemini:
  enabled: true
  max_calls_per_run: 50
  models:
    heavy: "gemini-3-pro-preview"
    medium: "gemini-3-flash-preview"
    light: "gemini-2.5-flash-lite"

# Amazon Bedrock configuration
# Set enabled: false to run in deterministic mode (no LLM, zero cost)
bedrock:
  enabled: false

# Logging
log_level: "INFO"

# Tracked entities for competitive intelligence
tracked_entities:
  - name: "Palantir"
    type: "company"
  - name: "Anduril"
    type: "company"
  - name: "Lockheed Martin"
    type: "company"
  - name: "Northrop Grumman"
    type: "company"
  - name: "Raytheon"
    type: "company"
  - name: "Shield AI"
    type: "company"
  - name: "Anthropic"
    type: "company"
  - name: "Google DeepMind"
    type: "company"
  - name: "OpenAI"
    type: "company"
  - name: "Department of Defense"
    type: "agency"
  - name: "DARPA"
    type: "agency"
  - name: "DIU"
    type: "agency"
