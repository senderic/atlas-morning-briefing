# Paper scoring weights
paper_scoring:
  has_code: 7
  topic_match: 3
  recency: 2
  citation_count: 1

# Reproduction feasibility gate (applied by intelligence layer)
# Papers scoring below repro_min_score/25 are dropped from top picks
repro_min_score: 12

# Delivery settings
kindle_email: "${KINDLE_EMAIL:-YOUR_NAME@kindle.com}"
sender_email: "${SENDER_EMAIL:-your-sender@gmail.com}"
output_format: "kindle"

# Email distribution list (receives rich HTML briefing)
# Can be a list or a comma-separated string in environment variables
email_recipients:
  - "${RECIPIENT_EMAIL:-your-email@example.com}"

# File naming pattern
file_naming: "Atlas-Briefing-{yyyy}.{mm}.{dd}"

# Paper recommendations
num_paper_picks: 3

# Date range for arxiv search (days)
arxiv_days_back: 3

# Maximum items per section
max_papers: 30
max_blogs: 12
max_news: 15

# Concurrency settings
max_workers: 1

# PDF settings
pdf:
  enabled: false
  font_size: 10
  line_spacing: 1.5
  include_toc: true
  include_emoji: false

# Gemini CLI configuration
gemini:
  enabled: true
  # When false (recommended), retries STOP on hard daily-quota errors
  # (RPD reached). When true, the client keeps retrying past the daily
  # cap — useful only if your error wording produces false positives,
  # since real RPD won't recover until midnight PT.
  ignore_hard_quota: false
  internal_max_attempts: 1
  max_calls_per_run: 50
  retry_wait_seconds: 61
  key_swap_delay: 5
  # Heavy-tier retry budget. With 90-450s backoff, 20 attempts ≈ up to 2-3h
  # of patient retrying — appropriate for unattended 4am cron runs that
  # prefer eventual success over fast failure.
  heavy_max_attempts: 20
  models:
    heavy: "pro"
    medium: "flash"
    light: "flash-lite"
  # On first use, the client queries the Gemini models.list endpoint
  # (GET v1beta/models?key=...) with the first loaded API key and
  # auto-populates fallback_models for any tier you didn't manually
  # fill in. The endpoint is fast and uses no quota. Set to false if
  # you'd rather pin model IDs by hand below.
  auto_discover_models: true
  # Alternate models tried IN ORDER when the primary model for a tier
  # exhausts its retries before falling to the next tier. Each model has
  # its own per-day RPD on Gemini free tier, so listing variants here
  # dramatically extends daily headroom. Leave a tier empty to let
  # auto-discovery populate it; fill it in to override.
  fallback_models:
    heavy: []
    medium: []
    light: []
  # Strikes-per-key on quota errors before rotating to the next key. With
  # tenacity's 90-450s exponential backoff between strikes, 3 strikes ≈
  # 5-22 min of patient retries on the same key before we move on. After
  # rotating through every key max_strikes_per_key times, we give up on
  # the current model and try the next one in fallback_models (then tier).
  max_strikes_per_key: 3
  # Minimum seconds between successive calls per tier. Defaults are sized for
  # Pro free tier (~2 RPM heavy, looser on Flash). Lower if you have paid
  # quota or multiple keys; raise if you're seeing 429s. Set to 0 to disable.
  tier_min_interval_seconds:
    heavy: 30
    medium: 5
    light: 2

# Amazon Bedrock configuration
# Set enabled: false to run in deterministic mode (no LLM, zero cost)
bedrock:
  enabled: false
  max_calls_per_run: 25

# Logging
log_level: "DEBUG"

