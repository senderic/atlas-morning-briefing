# Atlas Morning Briefing Configuration
# Copy this file to config.yaml and customize for your needs:
#   cp config.yaml.example config.yaml

# --- Pipeline identity ---
# Own status file per pipeline: run_briefing.sh runs this briefing and then the
# local one ~15 minutes later, and a shared status.json means the second run
# erases the first's counters.
pipeline_name: "atlas"
status_file_path: "status.json"

# Topics to scan on arxiv
# Status file for monitoring. The local pipeline writes its own
# (status-local.json) so the two runs cannot overwrite each other.
status_file_path: "status.json"
pipeline_name: "main"

