# Personal Finance Briefing Configuration
# Third pipeline beside main and local. Run with:
#   python3 scripts/briefing_runner.py --config config_finance.yaml
# Free RSS feeds only: no Brave searches, no email.

status_file_path: "status-finance.json"

pipeline_name: "finance"

state_file_path: ".finance-state.json"

briefing_title: "Personal Finance Briefing"

file_naming: "Finance-Briefing-{yyyy}.{mm}.{dd}"

arxiv_topics: []

stocks: []

blog_feeds:
  - name: "Federal Reserve Press Releases"
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
  - name: "SEC Press Releases"
    url: "https://www.sec.gov/news/pressreleases.rss"
  - name: "CFPB Newsroom"
    url: "https://www.consumerfinance.gov/about-us/newsroom/feed/"
  - name: "Calculated Risk"
    url: "https://www.calculatedriskblog.com/feeds/posts/default"
  - name: "Mortgage News Daily"
    url: "https://www.mortgagenewsdaily.com/rss/news"
  - name: "Kitces"
    url: "https://www.kitces.com/feed/"
  - name: "The Finance Buff"
    url: "https://thefinancebuff.com/feed"
  - name: "Bogleheads Blog"
    url: "https://www.bogleheads.org/blog/feed/"
  - name: "Wolf Street"
    url: "https://wolfstreet.com/feed/"
  - name: "Abnormal Returns"
    url: "https://abnormalreturns.com/feed/"
  - name: "HumbleDollar"
    url: "https://humbledollar.com/feed/"

# No Brave searches: this pipeline reads free RSS feeds only. sender-finances
# reuses the Brave results the main and local runs already saved.
news_queries: []

email_newsletters:
  enabled: false


# Newsletter mastheads and weather blocks can exceed the normal RSS excerpt.
# Give the ranker enough message text to reach the lead reporting.
email_newsletter_prompt_chars: 10000

interest_profile:
  - topic: "Federal Reserve policy, interest rates, and money market and Treasury bill yields"
    weight: 1.0
  - topic: "Changes to index funds and ETFs: fee cuts, mergers, closures, index changes at Schwab, Vanguard, iShares, Invesco"
    weight: 0.95
  - topic: "IRS rules for 401k, IRA, and Roth accounts: contribution limits, income phase-outs, deadlines"
    weight: 0.95
  - topic: "Federal and California tax changes affecting households and homeowners"
    weight: 0.9
  - topic: "Mortgage rates, refinancing conditions, and home equity lending"
    weight: 0.85
  - topic: "US large-cap and technology stock market moves and valuations"
    weight: 0.75
  - topic: "Investment-grade corporate bonds and credit markets"
    weight: 0.6
  - topic: "International developed and emerging market equities"
    weight: 0.55
  - topic: "Real estate investment trusts and the US housing market"
    weight: 0.55
  - topic: "Inflation, employment, and recession indicators"
    weight: 0.5
  - topic: "Evidence-based personal finance: asset allocation, rebalancing, tax-loss harvesting"
    weight: 0.4

briefing_profile:
  domain: "personal finance, household investing, and the rules that govern them"
  audience: >-
    a long-term index-fund investor who owns a home with a mortgage, holds
    a large cash position in a money market fund, and saves through 401k,
    IRA, and Roth accounts
  landscape: "the household finance, markets, and tax-policy landscape"
  actionable: true
  priorities:
    - >-
      Anything with a date or a decision attached: contribution-limit and
      tax-rule changes, filing and funding deadlines, a held fund merging,
      closing, or changing its fee, a rate move large enough to revisit cash
      or a mortgage. Lead with these.
    - >-
      Things that change what the household earns or pays: money market and
      Treasury yields, mortgage and refinance rates, California and federal
      tax changes, insurance and housing costs.
    - >-
      Market context for a broad index portfolio: large-cap and technology
      concentration, bonds, international, real estate. Keep it brief and
      skip single-stock stories and trading tips.


# Default freshness for any query with no branch binding (static news_queries).
news_freshness: "pd"

geo_filter:
  enabled: false


# --- Source diversity ---
# Cap on items from one outlet per section. The default 2 left the news section
# with only two items on a day the Union-Tribune had the three biggest local
# stories; a small local press corps justifies a looser cap.
source_diversity:
  max_per_source: 3


# --- Cross-outlet duplicate collapse ---
# One viral local story arrives from a dozen syndicating outlets with different
# headlines. Threshold is Jaccard overlap of headline content words, calibrated
# on live results: retellings of one story scored 0.23-0.47, distinct local
# stories 0.00-0.17.
news_similarity_dedup:
  enabled: true
  threshold: 0.3

alerts:
  enabled: false

section_order:
  - executive_summary
  - blogs

happenings_queries: []

max_happenings: 0

section_headings:
  executive_summary: "Executive Summary"
  blogs: "Finance News"
  errors: "Errors"


# --- Disable defense-specific features ---
features:
  source_blurbs: false  # keep feed attribution; omit unverified reputation claims
  solo_founder_angle: false
  agent_cost_optimization: false
  weekly_deep_dive: false


# --- EPUB metadata ---
epub:
  title_format: "Local Briefing - {date}"
  author: "Atlas Local"

output_dir: "briefings/finance"

snapshot:
  enabled: true
  dir: "snapshots/finance"


# --- Paper scoring (unused but required by code path) ---
paper_scoring:
  has_code: 5
  topic_match: 3
  recency: 2
  citation_count: 1

num_paper_picks: 2

repro_min_score: 12


# --- Maximum items ---
max_papers: 30

max_blogs: 12

max_news: 0

arxiv_days_back: 3


# Blog freshness window, separate from arxiv_days_back. Blogs and papers have
# different cadences: at 3 days a weekly blogger is invisible on most runs,
# which the quality checker reported as a yield collapse against feeds that
# were healthy. Measured 2026-08-29 across 28 feeds: 17 had posted within 3
# days, 19 within 7, 21 within 14. Cross-day dedup stops a wider window from
# re-showing an item the reader already saw.
blog_days_back: 14


# ArXiv fetch behaviour (legacy export.arxiv.org path).
#
# Topics are scanned SEQUENTIALLY, matching upstream. This used to run 8
# topics concurrently, which exceeds what export.arxiv.org tolerates: a run on
# 2026-08-27 lost 20/20 topic searches to 429s and read timeouts and shipped a
# briefing with no papers at all. ArXiv's terms ask for ~1 request per 3s.
arxiv_request_delay: 3.0

#
# Wrap multi-word topics in quotes for an exact phrase match. Upstream does
# this by default; measured against the live API on 2026-08-28 it returned 0
# papers for 7 of the 9 multi-word topics above (at 3 and at 14 days back),
# because these topics are conceptual descriptions rather than literal
# phrases. Recall is preferable here since TF-IDF scoring and the interest
# profile already cull irrelevant hits. Turn on only if your topics are
# literal phrases that appear verbatim in paper text.
arxiv_exact_phrase: false


# --- Concurrency ---
max_workers: 6


# --- PDF disabled ---
pdf:
  enabled: false

kindle_email: ""

sender_email: "${SENDER_EMAIL:-your-sender@gmail.com}"

output_format: "kindle"

email_recipients: []

log_level: "INFO"


# --- LLM CLI configuration (same as main pipeline) ---
gemini:
  enabled: false
  ignore_hard_quota: true
  track_hard_quotas: true
  internal_max_attempts: 1
  max_calls_per_run: 50
  retry_wait_seconds: 61
  key_swap_delay: 5
  call_log_path: "logs/finance-gemini-calls.jsonl"
  models:
    heavy: "pro"
    medium: "flash"
    light: "flash-lite"


# Codex CLI — a TRANSPORT with two roles, each with its own client and budget:
#   * the report writer (reader-facing prose): the top-level keys below;
#   * the first rung of every tier in llm.chains (`codex/<model>`): `chain:`.
# Authenticated by the CLI's own subscription login, not an API key.
codex:
  enabled: true
  binary: "/home/eric/.local/bin/codex"
  # --- report writer ---
  model: "gpt-5.6-sol"
  reasoning_effort: "high"
  timeout_seconds: 300
  max_calls_per_run: 5
  # --- chain rungs (analysis: ranking, filtering, summaries, the judge) ---
  chain:
    # Separate from the writer's 5 so analysis cannot starve the prose. A main
    # run makes ~14 chain calls and each attempt spends one unit; 40 covers a
    # run in which every call needed its retry.
    max_calls_per_run: 40
    # TIMEOUT BUDGET — one model, not a chain. Worst case for a rung is
    # queue_timeout + timeout x (1 + max_retries) + backoff = 120 + 360 + 2
    # = 482s, inside llm.rung_timeout_seconds (500). Every call carries ~20k
    # tokens of CLI harness; trivial prompts return in 12-25s, prose in 13-54s.
    timeout_seconds: 180
    max_retries: 1
    # Simultaneous `codex exec` processes. The runner fans out up to 4 calls
    # at once; a call that cannot get a slot within queue_timeout_seconds
    # fails its rung without spending budget.
    max_concurrent_requests: 3
    queue_timeout_seconds: 120
    # After this many failed calls in a row the chain stops trying Codex for
    # the rest of the run, so an outage costs a few timeouts, not one per call.
    max_consecutive_failures: 3
    # Reasoning effort per tier (the writer keeps `reasoning_effort` above).
    reasoning_effort:
      heavy: "high"
      medium: "medium"
      light: "low"
  # One JSONL line per attempt, writer and chain alike; `caller` ("writer" /
  # "chain" / "preflight") and `tier` tell them apart.
  call_log_path: "logs/finance-codex-calls.jsonl"
  # API-equivalent estimate shown in the footer, PER MODEL. Codex CLI uses
  # subscription authentication, so this is informational rather than a billed
  # API charge. A model with no entry is reported as "unknown" — terra and
  # luna rates are not known; add them here rather than borrowing sol's.
  pricing:
    gpt-5.6-sol:
      input_per_million: 2.0
      cached_input_per_million: 0.2
      output_per_million: 10.0


# OpenCode CLI backend — DISABLED, and no rung in llm.chains routes to it.
# Its free models were slow and unreliable (the medium one timed out on ~80%
# of calls), and the transport runs `opencode run --auto` over untrusted feed
# text. The client code stays; do not re-enable without revisiting both.
opencode:
  enabled: false
  # A call cap prevents a failed transport from consuming the entire run.
  max_calls_per_run: 20
  # TIMEOUT BUDGET — one model, not a chain. Worst case is
  # timeout x (1 + max_retries_per_model) = 150s, which must fit inside
  # llm.rung_timeout_seconds. Retries are 0 deliberately: a rung should fail
  # fast to the next one rather than burn the window retrying a stalled model.
  timeout: 150
  max_retries_per_model: 0
  # The configured OpenCode model is free.
  pricing:
    input_per_million: 0.0
    output_per_million: 0.0


# THE fallback chain. Each tier is an ordered list of MODELS, tried front to
# back; the backend that serves a rung is inferred from its routing prefix
# (`codex/`, `nvidia-direct/`, `openrouter/`, `gemini/`).
#
# Codex first on every tier, sized by weight class (sol > terra > luna); the
# free HTTP rungs behind it are fallbacks, in their previous relative order.
# Because the chain orders models rather than backends, that is expressed by
# position alone. Identical in config.yaml, config_local.yaml and
# config_finance.yaml — a routing change must touch all three.
#
# Two rules to keep: tiers stay distinct and monotonic (heavy > medium > light
# in size and context window), and within a tier a rung may only degrade DOWN a
# weight class, never up, so a heavy prompt never lands on a light model.
llm:
  chains:
    heavy:
      - "codex/gpt-5.6-sol"                                 # Codex CLI (subscription)
      - "nvidia-direct/nvidia/nemotron-3-ultra-550b-a55b"   # free NVIDIA NIM
      - "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free" # free, 550B / 1M ctx
      - "openrouter/dots-studio/dots-3-note-preview:free"   # free, 512k ctx
    medium:
      - "codex/gpt-5.6-terra"                               # Codex CLI (subscription)
      - "nvidia-direct/nvidia/nemotron-3-super-120b-a12b"   # free NVIDIA NIM
      - "openrouter/dots-studio/dots-3-note-preview:free"   # free, 512k ctx
      - "openrouter/nvidia/nemotron-3-super-120b-a12b:free" # free, degrade to light
      - "openrouter/nex-agi/nex-n2.5-pro:free"              # free, 262k ctx
    light:
      - "codex/gpt-5.6-luna"                                # Codex CLI (subscription)
      - "nvidia-direct/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning" # free NVIDIA NIM
      - "openrouter/nvidia/nemotron-3-super-120b-a12b:free" # free, 120B-A12B / 262k
      - "openrouter/cohere/north-mini-code:free"            # free, 256k ctx
      - "openrouter/inclusionai/ling-3.0-flash-vl:free"     # free, 262k ctx
  # Per-RUNG window. Each rung is one model, so this only has to cover that
  # model's own worst case: 482s for Codex (see codex.chain), 150s for the
  # two HTTP transports (timeout x (1 + retries)).
  # The old per-backend window had to cover a whole internal chain, and a
  # backend that overran it was cut off mid-chain on every call.
  rung_timeout_seconds: 500
  # No rung is billed per call (Codex is subscription-authenticated, the HTTP
  # rungs are free), so preflight may probe any of them.
  preflight_skip: []


# NVIDIA-hosted NIM API, used directly so medium/light calls do not depend on
# OpenRouter account health. The build.nvidia.com endpoints used here are free.
nvidia:
  enabled: true
  reasoning_budget: 512  # reserve output tokens for the answer on Nemotron Super
  api_base: "https://integrate.api.nvidia.com/v1/chat/completions"
  max_calls_per_run: 100
  max_concurrent_requests: 4
  timeout: 75
  max_retries_per_model: 1
  max_tokens: 4096
  temperature: 0.3
  pricing:
    input_per_million: 0.0
    output_per_million: 0.0


# OpenRouter configuration (OpenAI-compatible API) — free fallback rungs behind Codex.
# Requires an API key: OPENROUTER_API_KEY or OPENAI_API_KEY (pointing at
# OpenRouter) in the environment.
openrouter:
  enabled: true
  api_base: "https://openrouter.ai/api/v1/chat/completions"
  # A TRANSPORT. Which of its models serve which tier is in llm.chains above.
  # NOT in any chain, and why (re-verify before adding):
  #   minimax/minimax-m3:free            404 as of 2026-09-11, "unavailable for
  #                                      free, the paid version is available" —
  #                                      paid models are intentionally excluded.
  #   z-ai/glm-5.2:free                  persistently 429 "rate-limited upstream"
  #   google/gemma-4-*:free              404, blocked by this account's data policy
  #   nvidia/nemotron-3.5-lightning:free 400 "DEGRADED function cannot be invoked"
  #   thinkingmachines/inkling*:free     403, agentic harnesses only
  #   openrouter/auto                    NOT free — it is the paid auto-router
  #   openrouter/free                    free, but an auto-router: it picks its
  #                                      own model, which defeats rung pinning
  max_calls_per_run: 100
  # Simultaneous in-flight requests. The runner enriches sections in parallel
  # (max_workers), so this is the real throttle on the free tier: 6 concurrent
  # requests all succeeded, 12 produced silent empty bodies.
  max_concurrent_requests: 4
  # TIMEOUT BUDGET — one model, not a chain. Worst case is
  # timeout x (1 + max_retries_per_model) = 150s, inside llm.rung_timeout_seconds.
  # Real responses land in 3-25s; the retry exists for the transient upstream
  # 502s these free endpoints return inside an HTTP 200 body.
  timeout: 75
  max_retries_per_model: 1
  max_tokens: 4096
  temperature: 0.3
  # All models above are `:free`, so the run should bill $0.00. The usage
  # summary reports the API's own cost field and flags any non-zero value.
  pricing:
    input_per_million: 0.0
    output_per_million: 0.0


# LLM fallback chain tuning
composite:
  timeout_seconds: 500


# Amazon Bedrock configuration
# Set enabled: false to run in deterministic mode (no LLM, zero cost)
bedrock:
  enabled: false
